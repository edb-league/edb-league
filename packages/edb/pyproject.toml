[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edb"
version = "1.0.0"
description = "Regras e dados da EDB LEAGUE (rankings, temporadas, sorteio, importação de demos)."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
demo = ["demoparser2>=0.40,<1"]

[tool.setuptools]
packages = ["edb"]

[tool.setuptools.package-data]
edb = ["data/*.csv"]
