name: Importar imagens das skins
# Baixa o catálogo de skins do CS2 e guarda as imagens no Supabase Storage (bucket público "skins"),
# para o site não depender de terceiros. Rode em Actions > Importar imagens das skins > Run workflow.
# Precisa dos secrets SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY no repositório.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Só as N primeiras skins (teste). Deixe 0 para importar tudo."
        default: "0"
permissions: {}
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Importar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMITE: ${{ inputs.limite }}
        run: python scripts/importar_skins.py --limite "${LIMITE:-0}"
