name: Verificação da XINXAS LEAGUE
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências dos testes
        run: python -m pip install "pandas>=2.1,<3" "requests>=2.31,<3" "pytest>=8,<10"
      - name: Executar testes unitários
        run: python -m pytest -q
