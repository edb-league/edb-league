name: Verificação da EDB LEAGUE
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências dos testes
        run: python -m pip install "pandas>=2.1,<3" "requests>=2.31,<3" "pytest>=8,<10"
      - name: Verificar sintaxe do aplicativo
        run: python -m compileall -q app.py core.py storage.py demo_importer.py fixture_cards.py ranking_cards.py league_legacy.py legacy_views.py
      - name: Conferir componentes importados pelo aplicativo
        run: python -c "from fixture_cards import fixture_title, match_stat_coverage, basic_team_tables, CARD_CSS; from ranking_cards import ranking_cards, RANKING_CSS; from league_legacy import match_records, player_summary, hall_of_fame; from legacy_views import render_profile, render_hall; assert CARD_CSS and RANKING_CSS"
      - name: Executar testes unitários
        run: python -m pytest -q
