name: API e novo frontend
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/edb/**'
      - '.github/workflows/web-api.yml'
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências da API
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Testes da API
        run: python -m pytest -q apps/api/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Contraste de cores (WCAG AA)
        run: npm run check:contrast
      - name: Build de produção
        run: npm run build
  e2e:
    # Os testes de navegador (acessibilidade com axe, navegação, 320 px sem rolagem lateral, administração).
    # O Playwright sobe a API em modo demonstração e o site sozinho.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências da API
        working-directory: .
        run: python -m pip install -r apps/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador
        run: npm run test:e2e
      - name: Guardar o rastro dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastros-playwright
          path: apps/web/test-results
          retention-days: 7
