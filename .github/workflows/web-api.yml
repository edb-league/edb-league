name: API e novo frontend
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/edb/**'
      - '.github/workflows/web-api.yml'
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências da API
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Testes da API
        run: python -m pytest -q apps/api/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Contraste de cores (WCAG AA)
        run: npm run check:contrast
      - name: Build de produção
        run: npm run build
