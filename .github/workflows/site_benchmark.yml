name: Benchmark do carregamento público
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site_benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Python e Playwright
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Aguardar a estabilização do deploy
        run: sleep 10
      - name: Medir respostas HTTP e páginas Streamlit com navegador real
        run: |
          python - <<'PY'
          import json
          import statistics
          import subprocess
          import time
          
          TARGET = "https://edb-league.streamlit.app/"
          data = {"http": [], "browser": []}
          
          def seconds(start):
              return round(time.perf_counter() - start, 3)
          
          def record(stage, **kwargs):
              payload={"stage":stage, **kwargs}
              print("MEASURE " + json.dumps(payload, ensure_ascii=False), flush=True)
          
          for i in range(3):
              result = subprocess.run(
                  ["curl", "-L", "-sS", "--max-time", "15",
                   "-o", "/dev/null",
                   "-w", "%{http_code};%{time_namelookup};%{time_connect};%{time_appconnect};%{time_starttransfer};%{time_total}",
                   TARGET],
                  capture_output=True, text=True,
              )
              fields = result.stdout.strip().split(";")
              if result.returncode == 0 and len(fields) == 6:
                  row = {"attempt":i+1,"status":fields[0],
                         "dns":float(fields[1]),"connect":float(fields[2]),
                         "tls":float(fields[3]),"ttfb":float(fields[4]),
                         "total":float(fields[5])}
                  data["http"].append(row)
                  record("http",**row)
              else:
                  record("http_error", attempt=i+1, message=result.stderr[-350:])
              time.sleep(1)
          
          try:
              from playwright.sync_api import sync_playwright
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(headless=True, args=["--no-sandbox"])
                  for device, options in [
                      ("desktop", {"viewport":{"width":1365,"height":900}}),
                      ("mobile", {"viewport":{"width":390,"height":844},
                                  "is_mobile":True,"device_scale_factor":2,
                                  "has_touch":True})]:
                      for attempt in range(1, 3):
                          context = browser.new_context(**options)
                          page = context.new_page()
                          timings={"device":device,"attempt":attempt}
                          try:
                              start=time.perf_counter()
                              response=page.goto(TARGET,wait_until="domcontentloaded",timeout=25000)
                              timings["dom_content_loaded"]=seconds(start)
                              timings["http_status"]=response.status if response else None
                              page.get_by_text("Os Xinxas agora têm ranking.",exact=False).first.wait_for(timeout=25000)
                              timings["home_hero_visible"]=seconds(start)
                              page.get_by_text("Classificação Elite",exact=False).first.wait_for(timeout=25000)
                              timings["home_chart_heading_visible"]=seconds(start)
                              # Navegacao separada mede o tempo ate ranking estar desenhado.
                              start=time.perf_counter()
                              page.goto(TARGET+"?page=rankings&season=0",
                                        wait_until="domcontentloaded",timeout=25000)
                              timings["ranking_dom_content_loaded"]=seconds(start)
                              page.get_by_text("Rankings da EDB LEAGUE",exact=False).first.wait_for(timeout=25000)
                              timings["ranking_header_visible"]=seconds(start)
                              data["browser"].append(timings)
                              record("browser",**timings)
                          except Exception as exc:
                              record("browser_error",**timings,error=str(exc)[:600])
                          finally:
                              context.close()
                  browser.close()
          except Exception as exc:
              record("browser_initialization_error",error=str(exc)[:600])
          
          for metric,items,key in [
              ("TTFB", data["http"],"ttfb"),
              ("HTTP total",data["http"],"total"),
              ("Página inicial desktop", [x for x in data["browser"] if x["device"]=="desktop"],"home_hero_visible"),
              ("Página inicial mobile",[x for x in data["browser"] if x["device"]=="mobile"],"home_hero_visible"),
              ("Ranking desktop",[x for x in data["browser"] if x["device"]=="desktop"],"ranking_header_visible"),
              ("Ranking mobile",[x for x in data["browser"] if x["device"]=="mobile"],"ranking_header_visible"),
          ]:
              values=[x[key] for x in items if key in x]
              if values:
                  record("summary",metric=metric,count=len(values),
                         median=round(statistics.median(values),3),
                         minimum=min(values),maximum=max(values))
          print("BENCHMARK_FINISHED",flush=True)
          PY
